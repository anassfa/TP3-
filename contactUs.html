
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <title>ALGO Gaming - Best Gaming Site Ever!</title>
<meta name="description" content="ALGO Gaming: discover trending games, most played titles and top game categories.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

    <link rel="stylesheet" href="assets/css/monStyle.css">
</head>

<body>

    <header class="headerContainer">
        <div class="header">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="ALGO Gaming">
            </a>

            <nav class="headerLinks" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="shop.html">Our Shop</a>
                <a href="product-details.html">Product Details</a>
                <a href="contactUs.html" aria-current="page">Contact Us</a>
                <button class="btn" type="button">Sign In</button>
            </nav>
        </div>
    </header>

   
    <section class="container text-center py-5">
        <h1>Contact Us</h1>

        <nav aria-label="Breadcrumb">
            <a href="index.html">Home</a> /
            <span>Contact Us</span>
        </nav>
    </section>

  
    <main class="container py-5">

        <div class="row g-5">

            
            <div class="col-12 col-lg-5">
                <h2>Get in Touch</h2>

                <p>
                    Send us a message using the contact form.
                </p>

                <div class="card shadow-sm mt-4">
                    <div class="card-body">
                        <h3 class="h5">Our Website</h3>
                        <p class="mb-0">ALGO Gaming</p>
                    </div>
                </div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h3 class="h5">Customer Support</h3>
                        <p class="mb-0">
                            Fill in the form and describe your request.
                        </p>
                    </div>
                </div>
            </div>

            <!-- CONTACT FORM -->
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="h4 mb-4">Send Us a Message</h2>

                        <form id="contactForm">

                            <div class="mb-3">
                                <label for="contactName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="contactName"
                                    name="name"
                                    placeholder="Enter your name"
                                    required
                                    minlength="2"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="contactEmail" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="contactEmail"
                                    name="email"
                                    placeholder="example@email.com"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="contactSubject" class="form-label">
                                    Subject
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="contactSubject"
                                    name="subject"
                                    placeholder="Message subject"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="contactMessage" class="form-label">
                                    Your Message
                                </label>

                                <textarea
                                    class="form-control"
                                    id="contactMessage"
                                    name="message"
                                    rows="5"
                                    placeholder="Write your message..."
                                    required
                                    minlength="10"
                                ></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Send Message
                            </button>

                            <p id="contactFeedback"
                               class="mt-3 mb-0"
                               aria-live="polite"></p>

                        </form>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footerContainer">
        <div class="footer">
            <p>Copyright &copy; 2026 ALGO Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/monScript4.js"></script>
</body>
</html>
